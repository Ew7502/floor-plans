<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Floor Plan Designer</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .toolbar {
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            width: 800px;
            box-sizing: border-box;
        }
        .divider {
            width: 1px;
            height: 30px;
            background: #ccc;
            margin: 0 10px;
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background-color: #e0e0e0;
            color: #333;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #d0d0d0; }
        
        /* Active states for different tool categories */
        button.active-floor { background-color: #0066cc; color: white; }
        button.active-tool { background-color: #28a745; color: white; }
        
        .danger { background-color: #dc3545; color: white; }
        .danger:hover { background-color: #c82333; }
        
        canvas {
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            cursor: crosshair;
            border: 1px solid #ccc;
        }
        
        /* Grid background */
        .grid-bg {
            background-image: 
                linear-gradient(to right, #f0f0f0 1px, transparent 1px),
                linear-gradient(to bottom, #f0f0f0 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <!-- Floor Selection -->
        <button id="btnFloor1" class="floor-btn active-floor">First Floor</button>
        <button id="btnFloor2" class="floor-btn">Second Floor</button>
        
        <div class="divider"></div>
        
        <!-- Tool Selection -->
        <button id="btnToolRoom" class="tool-btn active-tool">Draw Room</button>
        <button id="btnToolDoor" class="tool-btn">Draw Door</button>
        <button id="btnToolWindow" class="tool-btn">Draw Window</button>
        
        <div class="divider"></div>
        
        <button id="btnClear" class="danger">Clear Floor</button>
    </div>

    <canvas id="floorCanvas" width="800" height="600" class="grid-bg"></canvas>

    <script>
        const canvas = document.getElementById('floorCanvas');
        const ctx = canvas.getContext('2d');
        
        // Updated data structure to hold rooms, doors, and windows separately
        let floorPlans = {
            floor1: { rooms: [], doors: [], windows: [] },
            floor2: { rooms: [], doors: [], windows: [] }
        };
        
        let currentFloor = 'floor1';
        let currentTool = 'room'; // Can be 'room', 'door', or 'window'
        let isDrawing = false;
        let startX, startY;

        function loadSavedPlans() {
            // Using a new save key so we don't conflict with your old V1 data
            const saved = localStorage.getItem('myHousePlansV2');
            if (saved) {
                floorPlans = JSON.parse(saved);
            }
        }

        function savePlans() {
            localStorage.setItem('myHousePlansV2', JSON.stringify(floorPlans));
        }

        // Helper function to draw a rectangle with specific styles
        function drawRect(item, fillColor, strokeColor, lineWidth) {
            ctx.fillStyle = fillColor;
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = lineWidth;
            ctx.beginPath();
            ctx.rect(item.x, item.y, item.w, item.h);
            ctx.fill();
            ctx.stroke();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const currentData = floorPlans[currentFloor];
            
            // 1. Draw Rooms (Bottom layer)
            currentData.rooms.forEach(room => {
                drawRect(room, 'rgba(0, 102, 204, 0.1)', '#333', 3);
            });
            
            // 2. Draw Windows (Middle layer - light blue/glass)
            currentData.windows.forEach(window => {
                drawRect(window, 'rgba(135, 206, 235, 0.6)', '#005b9f', 2);
            });
            
            // 3. Draw Doors (Top layer - brown)
            currentData.doors.forEach(door => {
                drawRect(door, '#8b4513', '#4a250a', 2);
            });
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            
            const rect = canvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;
            const width = currentX - startX;
            const height = currentY - startY;

            draw(); 
            
            // Draw temporary preview based on the selected tool
            let preview = { x: startX, y: startY, w: width, h: height };
            if (currentTool === 'room') drawRect(preview, 'rgba(0, 102, 204, 0.3)', '#0066cc', 3);
            if (currentTool === 'window') drawRect(preview, 'rgba(135, 206, 235, 0.8)', '#005b9f', 2);
            if (currentTool === 'door') drawRect(preview, 'rgba(139, 69, 19, 0.8)', '#4a250a', 2);
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            
            const rect = canvas.getBoundingClientRect();
            const endX = e.clientX - rect.left;
            const endY = e.clientY - rect.top;
            const width = endX - startX;
            const height = endY - startY;
            
            if (Math.abs(width) > 5 && Math.abs(height) > 5) {
                const newItem = {
                    x: width < 0 ? endX : startX,
                    y: height < 0 ? endY : startY,
                    w: Math.abs(width),
                    h: Math.abs(height)
                };
                
                // Push the new item into the correct array based on the tool
                if (currentTool === 'room') floorPlans[currentFloor].rooms.push(newItem);
                if (currentTool === 'window') floorPlans[currentFloor].windows.push(newItem);
                if (currentTool === 'door') floorPlans[currentFloor].doors.push(newItem);
                
                savePlans();
            }
            draw();
        });

        // --- UI Events ---
        
        // Floor Buttons
        document.querySelectorAll('.floor-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.floor-btn').forEach(b => b.classList.remove('active-floor'));
                e.target.classList.add('active-floor');
                currentFloor = e.target.id === 'btnFloor1' ? 'floor1' : 'floor2';
                draw();
            });
        });

        // Tool Buttons
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active-tool'));
                e.target.classList.add('active-tool');
                
                if (e.target.id === 'btnToolRoom') currentTool = 'room';
                if (e.target.id === 'btnToolDoor') currentTool = 'door';
                if (e.target.id === 'btnToolWindow') currentTool = 'window';
            });
        });

        document.getElementById('btnClear').addEventListener('click', () => {
            if(confirm('Are you sure you want to clear this floor? This cannot be undone.')) {
                floorPlans[currentFloor] = { rooms: [], doors: [], windows: [] };
                savePlans();
                draw();
            }
        });

        // Initialize
        loadSavedPlans();
        draw();
    </script>
</body>
</html>
