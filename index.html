<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Floor Plan Designer V3</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .toolbar {
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            width: 900px;
            box-sizing: border-box;
        }
        .divider {
            width: 1px;
            height: 30px;
            background: #ccc;
            margin: 0 5px;
        }
        button {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            background-color: #e0e0e0;
            color: #333;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            font-size: 13px;
        }
        button:hover { background-color: #d0d0d0; }
        
        button.active-floor { background-color: #333; color: white; }
        button.active-tool { background-color: #28a745; color: white; }
        
        .danger { background-color: #dc3545; color: white; }
        .danger:hover { background-color: #c82333; }
        
        canvas {
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            cursor: crosshair;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button id="btnFloor1" class="floor-btn active-floor">First Floor</button>
        <button id="btnFloor2" class="floor-btn">Second Floor</button>
        
        <div class="divider"></div>
        
        <button id="btnToolRoom" class="tool-btn active-tool">Draw Room</button>
        <button id="btnToolDoor" class="tool-btn">Draw Door</button>
        <button id="btnToolWindow" class="tool-btn">Draw Window</button>
        <button id="btnToolLabel" class="tool-btn">Add Label</button>
        
        <div class="divider"></div>
        
        <button id="btnClear" class="danger">Clear Floor</button>
    </div>

    <canvas id="floorCanvas" width="900" height="700"></canvas>

    <script>
        const canvas = document.getElementById('floorCanvas');
        const ctx = canvas.getContext('2d');
        
        let floorPlans = {
            floor1: { rooms: [], doors: [], windows: [], labels: [] },
            floor2: { rooms: [], doors: [], windows: [], labels: [] }
        };
        
        let currentFloor = 'floor1';
        let currentTool = 'room'; 
        let isDrawing = false;
        let startX, startY;

        function loadSavedPlans() {
            const saved = localStorage.getItem('myHousePlansV3');
            if (saved) {
                floorPlans = JSON.parse(saved);
            }
        }

        function savePlans() {
            localStorage.setItem('myHousePlansV3', JSON.stringify(floorPlans));
        }

        function drawRect(item, fillColor, strokeColor, lineWidth) {
            ctx.fillStyle = fillColor;
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = lineWidth;
            ctx.beginPath();
            ctx.rect(item.x, item.y, item.w, item.h);
            ctx.fill();
            ctx.stroke();
        }

        // FIXED: Upgraded door drawing logic to prevent canvas crashes and draw better swings
        function drawDoorArc(door) {
            const w = door.w;
            const h = door.h;
            
            // Math.abs forces the radius to be a positive number, preventing the crash
            const radius = Math.max(Math.abs(w), Math.abs(h));
            
            if (radius === 0) return; // Prevent drawing if there is no size

            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1.5;
            
            // Draw the straight door panel
            ctx.beginPath();
            ctx.moveTo(door.x, door.y);
            ctx.lineTo(door.x + w, door.y + h);
            ctx.stroke();
            
            // Draw the dashed arc swing
            ctx.beginPath();
            ctx.setLineDash([5, 5]); 
            
            // Determine the correct angle for the arc based on drag direction
            let startAngle = 0;
            let endAngle = Math.PI / 2;
            
            if (w < 0 && h > 0) { startAngle = Math.PI / 2; endAngle = Math.PI; } // Bottom-Left
            else if (w < 0 && h < 0) { startAngle = Math.PI; endAngle = Math.PI * 1.5; } // Top-Left
            else if (w > 0 && h < 0) { startAngle = Math.PI * 1.5; endAngle = 0; } // Top-Right

            ctx.arc(door.x, door.y, radius, startAngle, endAngle);
            ctx.stroke();
            ctx.setLineDash([]); 
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const currentData = floorPlans[currentFloor];
            
            // 1. Draw Rooms 
            currentData.rooms.forEach(room => {
                drawRect(room, '#d3dadd', '#666666', 6);
            });
            
            // 2. Draw Windows 
            currentData.windows.forEach(window => {
                drawRect(window, '#ffffff', '#333333', 1.5);
                ctx.beginPath();
                ctx.moveTo(window.x, window.y + window.h/2);
                ctx.lineTo(window.x + window.w, window.y + window.h/2);
                ctx.stroke();
            });
            
            // 3. Draw Doors 
            currentData.doors.forEach(door => {
                // Clear the wall underneath safely using absolute dimensions
                ctx.fillStyle = '#d3dadd';
                const rectX = door.w < 0 ? door.x + door.w : door.x;
                const rectY = door.h < 0 ? door.y + door.h : door.y;
                ctx.fillRect(rectX, rectY, Math.abs(door.w), Math.abs(door.h));
                
                drawDoorArc(door);
            });

            // 4. Draw Labels
            ctx.fillStyle = '#000000';
            ctx.textAlign = 'center';
            currentData.labels.forEach(label => {
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText(label.text, label.x, label.y);
                if(label.subtext) {
                    ctx.font = '12px sans-serif';
                    ctx.fillText(label.subtext, label.x, label.y + 18);
                }
            });
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;

            if (currentTool === 'label') {
                const roomName = prompt("Enter room name (e.g. KITCHEN):");
                if (roomName) {
                    const dimensions = prompt("Enter dimensions (optional, e.g. 10'-0\" x 12'-0\"):");
                    floorPlans[currentFloor].labels.push({
                        x: startX,
                        y: startY,
                        text: roomName.toUpperCase(),
                        subtext: dimensions
                    });
                    savePlans();
                    draw();
                }
                return; 
            }
            isDrawing = true;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing || currentTool === 'label') return;
            
            const rect = canvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;
            const width = currentX - startX;
            const height = currentY - startY;

            draw(); 
            
            let preview = { x: startX, y: startY, w: width, h: height };
            
            // Normalizing width and height for drawing previews of rooms/windows
            let normalizedPreview = {
                x: width < 0 ? currentX : startX,
                y: height < 0 ? currentY : startY,
                w: Math.abs(width),
                h: Math.abs(height)
            };

            if (currentTool === 'room') drawRect(normalizedPreview, 'rgba(211, 218, 221, 0.5)', '#666', 6);
            if (currentTool === 'window') drawRect(normalizedPreview, 'rgba(255, 255, 255, 0.8)', '#333', 1.5);
            
            // Doors need the raw negative/positive values to know which way to swing
            if (currentTool === 'door') drawDoorArc(preview);
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isDrawing || currentTool === 'label') return;
            isDrawing = false;
            
            const rect = canvas.getBoundingClientRect();
            const endX = e.clientX - rect.left;
            const endY = e.clientY - rect.top;
            const width = endX - startX;
            const height = endY - startY;
            
            if (Math.abs(width) > 5 || Math.abs(height) > 5) {
                
                // Rooms and Windows save absolute bounds
                if (currentTool === 'room' || currentTool === 'window') {
                    const newItem = {
                        x: width < 0 ? endX : startX,
                        y: height < 0 ? endY : startY,
                        w: Math.abs(width),
                        h: Math.abs(height)
                    };
                    if (currentTool === 'room') floorPlans[currentFloor].rooms.push(newItem);
                    if (currentTool === 'window') floorPlans[currentFloor].windows.push(newItem);
                }
                
                // Doors save their raw directional data so they swing the right way on reload
                if (currentTool === 'door') {
                     floorPlans[currentFloor].doors.push({
                         x: startX,
                         y: startY,
                         w: width,
                         h: height
                     });
                }
                savePlans();
            }
            draw();
        });

        // UI Events
        document.querySelectorAll('.floor-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.floor-btn').forEach(b => b.classList.remove('active-floor'));
                e.target.classList.add('active-floor');
                currentFloor = e.target.id === 'btnFloor1' ? 'floor1' : 'floor2';
                draw();
            });
        });

        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active-tool'));
                e.target.classList.add('active-tool');
                
                if (e.target.id === 'btnToolRoom') currentTool = 'room';
                if (e.target.id === 'btnToolDoor') currentTool = 'door';
                if (e.target.id === 'btnToolWindow') currentTool = 'window';
                if (e.target.id === 'btnToolLabel') currentTool = 'label';
            });
        });

        document.getElementById('btnClear').addEventListener('click', () => {
            if(confirm('Are you sure you want to clear this floor? This cannot be undone.')) {
                floorPlans[currentFloor] = { rooms: [], doors: [], windows: [], labels: [] };
                savePlans();
                draw();
            }
        });

        // Boot up
        loadSavedPlans();
        draw();
    </script>
</body>
</html>
